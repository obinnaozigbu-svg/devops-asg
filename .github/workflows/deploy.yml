name: Deploy to ECS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # 3. Login to ECR
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build Docker image
      - name: Build image
        run: |
          docker build -t my-nginx-app .

      # 5. Tag image
      - name: Tag image
        run: |
          docker tag my-nginx-app:latest 191369739072.dkr.ecr.eu-north-1.amazonaws.com/my-nginx-app:latest

      # 6. Push image to ECR
      - name: Push image
        run: |
          docker push 191369739072.dkr.ecr.eu-north-1.amazonaws.com/my-nginx-app:latest

      # 7. Force ECS deployment refresh
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster devops-cluster \
            --service nginx-service \
            --force-new-deployment